services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: projetoescala:latest
    container_name: escala-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:3001"
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - PORT=3001
      - DB_PATH=/app/data/escala.db
      - JWT_SECRET=${JWT_SECRET:-troque-este-segredo-para-32-chars-ou-mais-em-producao}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@1234}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - ./data:/app/data
    networks:
      - escala-net

networks:
  escala-net:
    driver: bridge
