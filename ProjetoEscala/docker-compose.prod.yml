version: "3.8"

services:
  app:
    image: projetoescala:latest
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - PORT=3001
      - DB_PATH=/app/data/escala.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@1234}
      - CORS_ORIGIN=https://escala.seu-dominio.com
    volumes:
      - escala-data:/app/data
    networks:
      - RedeInterna
    deploy:
      mode: replicated
      replicas: 1
      # Sem restart_policy explícita — o Swarm usa os defaults (condition: any,
      # delay: 5s, max_attempts: 0 = ilimitado). Isso é melhor que condition:
      # on-failure + max_attempts: 3 por dois motivos: (1) pega qualquer saída,
      # inclusive exit 0 da rota de restore, e (2) não "desiste" após poucas
      # tentativas — um crash transitório não derruba o serviço permanentemente.
      labels:
        - traefik.enable=true
        - traefik.docker.network=RedeInterna
        - traefik.http.routers.escala.rule=Host(`escala.seu-dominio.com`)
        - traefik.http.routers.escala.entrypoints=websecure
        - traefik.http.routers.escala.priority=10
        - traefik.http.routers.escala.tls.certresolver=letsencryptresolver
        - traefik.http.routers.escala.service=escala
        - traefik.http.services.escala.loadbalancer.server.port=3001
        - traefik.http.services.escala.loadbalancer.passHostHeader=1

volumes:
  escala-data:
    driver: local

networks:
  RedeInterna:
    external: true
